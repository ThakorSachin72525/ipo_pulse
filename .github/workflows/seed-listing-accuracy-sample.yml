name: Seed Phase 5 Listing Accuracy Sample

on:
  workflow_dispatch:

jobs:
  seed-sample:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install ".[dev]"

      - name: Verify required database tables
        run: python -m scripts.check_supabase

      - name: Insert idempotent Phase 5 sample data
        run: python -m scripts.seed_listing_accuracy_sample
