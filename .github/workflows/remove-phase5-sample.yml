name: Remove Phase 5 Sample Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-sample:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install .
      - name: Delete tagged Phase 5 sample rows
        run: python -m scripts.remove_phase5_sample
